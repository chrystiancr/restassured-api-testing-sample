name: API Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Health Check Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run health check tests
        run: mvn -B -Dtest=HealthCheckTest test

  contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run contract tests
        run: mvn -B -Dtest=ContractTest test

  functional:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run functional tests
        run: mvn -B -Dtest=FunctionalTest test

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: functional
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run acceptance tests
        run: mvn -B -Dtest=AcceptanceTest test
